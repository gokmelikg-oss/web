<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Şimşek Solar otomatik kontrol paneli illüstrasyonu">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f7"/>
      <stop offset="1" stop-color="#dbe1ee"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3244"/>
      <stop offset="1" stop-color="#171d29"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243444"/>
      <stop offset="1" stop-color="#12202b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg2)"/>
  <!-- cihaz gövdesi -->
  <rect x="200" y="180" width="400" height="440" rx="30" fill="url(#body)"/>
  <rect x="200" y="180" width="400" height="440" rx="30" fill="none" stroke="#3a445c" stroke-width="2"/>
  <!-- üst marka bandı -->
  <circle cx="250" cy="228" r="10" fill="#8b9be0"/>
  <text x="272" y="235" font-family="Verdana,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#eef1f7">ŞİMŞEK</text>
  <text x="470" y="233" font-family="Verdana,Arial,sans-serif" font-size="15" letter-spacing="2" fill="#8b9be0">AD598</text>
  <!-- LCD ekran -->
  <rect x="240" y="260" width="320" height="180" rx="12" fill="url(#lcd)"/>
  <rect x="240" y="260" width="320" height="180" rx="12" fill="none" stroke="#0d1720" stroke-width="4"/>
  <text x="262" y="300" font-family="Verdana,Arial,sans-serif" font-size="17" fill="#7fe0c0">SICAK SU</text>
  <text x="470" y="300" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="700" fill="#eef8f4">58°C</text>
  <text x="262" y="336" font-family="Verdana,Arial,sans-serif" font-size="17" fill="#7fbfe0">KOLEKTÖR</text>
  <text x="470" y="336" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="700" fill="#eef8f4">72°C</text>
  <rect x="262" y="356" width="276" height="10" rx="5" fill="#0d1720"/>
  <rect x="262" y="356" width="188" height="10" rx="5" fill="#8b9be0"/>
  <text x="262" y="410" font-family="Verdana,Arial,sans-serif" font-size="15" fill="#93a1b8">POMPA</text>
  <circle cx="330" cy="405" r="7" fill="#22c98b"/>
  <text x="360" y="410" font-family="Verdana,Arial,sans-serif" font-size="15" fill="#93a1b8">AKTİF</text>
  <!-- buton satırı -->
  <g>
    <circle cx="280" cy="500" r="30" fill="#323b50"/>
    <circle cx="280" cy="500" r="30" fill="none" stroke="#8b9be0" stroke-width="3"/>
    <rect x="266" y="497" width="28" height="6" rx="3" fill="#8b9be0"/>
    <circle cx="400" cy="500" r="30" fill="#323b50"/>
    <circle cx="400" cy="500" r="12" fill="#22c98b"/>
    <circle cx="520" cy="500" r="30" fill="#323b50"/>
    <rect x="507" y="487" width="26" height="26" rx="4" fill="#e0574f"/>
  </g>
  <!-- alt LED şeridi -->
  <g>
    <circle cx="300" cy="576" r="7" fill="#22c98b"/>
    <circle cx="340" cy="576" r="7" fill="#f6bc32"/>
    <circle cx="380" cy="576" r="7" fill="#8b9be0"/>
  </g>
</svg>
